# Deploy settings for component __C__ (nestjs-api). Read by bin/katap as data.
type=nestjs-api
image=ghcr.io/OWNER/REPO
# The `migrate` target, published by the same workflow as its own repository.
image_migrate=ghcr.io/OWNER/REPO-migrate
source_repo=OWNER/REPO
# attested: this server deploys only images attested by source_repo's
# publish-image.yml, from main (production) or main/staging (staging); it checks
# before pulling, with KATAP_GH_TOKEN from /etc/katap/katap.env. The default, and
# available for public repositories on every GitHub plan. none: for a private
# repository on a plan without attestations; anyone able to push to image= can
# then deploy it.
provenance=attested
# Which environment this component belongs to. Each deploy key serves one
# environment (provision.sh --ci-env), so a staging deploy can never replace a
# production component, even with both on one server.
environment=production
domains=__DOMAINS__
port=3000
predeploy=__C__-migrate
rollout=__C__
smoke_service=__C__
smoke_path=/api/health/readiness
smoke_body="status":"ok"
cron=
backup=__C__-db
