# Deploy settings for component __C__ (spa). Read by bin/katap as data.
type=spa
image=ghcr.io/OWNER/REPO
# Which environment this component belongs to. Each deploy key serves one
# environment (katap deploy-key binds it), so a staging deploy can never replace a
# production component, even with both on one server.
environment=production
domains=__DOMAINS__
port=80
predeploy=
rollout=__C__
smoke_service=__C__
smoke_path=/
smoke_body=
cron=
backup=
