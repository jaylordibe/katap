# Component __C__: an API built from jaylordibe/laravel-api (or a fork of it).
#
# The image's own contract is in that repository's DEPLOYMENT.md: one image, the
# runtime chosen by APP_RUNTIME_MODE. This file maps it onto one host:
#
#   __C__              api runtime (nginx + php-fpm), the only service on `edge`
#   __C__-worker       Horizon
#   __C__-migrate      predeploy, then __C__-permissions (DEPLOYMENT.md §13-§14)
#   __C__-scheduler    cron: `schedule:run`, once a minute (never a looping service)
#   __C__-artisan      tools: `katap run <project> __C__-artisan <artisan args>`
#   __C__-db           PostgreSQL with TLS (app:check-config refuses sslmode disable)
#   __C__-redis        cache, queue, locks, rate limits
#
# Copied into projects/<project>/ by `katap add`; edit it there per project.

x-__C__-logging: &__C__-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-__C__-app: &__C__-app
  image: ${IMAGE___CU__:-katap/unreleased:none}
  env_file:
    - ${KATAP_SECRETS}/__C__.env
  # One-shot runtimes install no SIGTERM handler as PID 1; an init forwards it.
  init: true
  logging: *__C__-logging
  security_opt:
    - no-new-privileges:true
  depends_on:
    __C__-db:
      condition: service_healthy
    __C__-redis:
      condition: service_healthy

services:
  __C__:
    <<: *__C__-app
    environment:
      APP_RUNTIME_MODE: api
    restart: unless-stopped
    # php-fpm runs pm.max_children = 20 in the base image; at ~80-150MB each this
    # is the ceiling, not the typical use. Lower it if the host is small.
    mem_limit: 1g
    # No swapping beyond the limit: one busy project must not thrash the shared swap.
    memswap_limit: 1g
    # Above nginx's 60s fastcgi_read_timeout, so a recreate lets in-flight requests finish.
    stop_grace_period: 65s
    # The test itself is the image's (docker/healthcheck.sh); only the timing is
    # tightened so `up --wait` notices a healthy container in seconds.
    healthcheck:
      interval: 30s
      start_period: 90s
      start_interval: 2s
    networks:
      default: {}
      edge:
        aliases:
          - ${KATAP_PROJECT}-__C__

  __C__-worker:
    <<: *__C__-app
    environment:
      APP_RUNTIME_MODE: worker
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    # >= HORIZON_TIMEOUT + 15s (DEPLOYMENT.md "Worker"): a shorter grace period
    # kills in-flight jobs, which then run a second time after retry_after.
    stop_grace_period: 90s
    healthcheck:
      interval: 30s
      start_period: 60s
      start_interval: 2s

  __C__-migrate:
    <<: *__C__-app
    environment:
      APP_RUNTIME_MODE: migrate
    profiles: [predeploy]
    restart: 'no'

  __C__-permissions:
    <<: *__C__-app
    environment:
      APP_RUNTIME_MODE: artisan
    command: ['db:seed', '--class=PermissionsSeeder', '--force', '--no-interaction']
    profiles: [predeploy]
    restart: 'no'

  __C__-scheduler:
    <<: *__C__-app
    environment:
      APP_RUNTIME_MODE: scheduler
    profiles: [cron]
    restart: 'no'

  __C__-artisan:
    <<: *__C__-app
    environment:
      APP_RUNTIME_MODE: artisan
    profiles: [tools]
    restart: 'no'

  __C__-db:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    logging: *__C__-logging
    shm_size: 256mb
    # A clean shutdown checkpoint, not a SIGKILL after Docker's 10s default.
    stop_grace_period: 60s
    env_file:
      - ${KATAP_SECRETS}/__C__.db.env
    # The key must belong to the postgres user and be unreadable by others, which a
    # bind mount cannot guarantee, so it is installed into the data volume first.
    entrypoint: ['/bin/sh', '/katap/postgres-entrypoint.sh']
    volumes:
      - __C__-db:/var/lib/postgresql
      - ${KATAP_SECRETS}/__C__-db-tls:/katap/tls:ro
      - ${KATAP_ROOT}/lib/postgres-entrypoint.sh:/katap/postgres-entrypoint.sh:ro
      - ${KATAP_ROOT}/lib/postgres-init.sh:/docker-entrypoint-initdb.d/10-katap-app-role.sh:ro
      - ${KATAP_ROOT}/lib/app-database.sql:/katap/app-database.sql:ro
    healthcheck:
      # Over TCP: the image's first-start temporary server answers on the socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  __C__-redis:
    image: redis:8.6.7-alpine@sha256:ac2da09bc822f325a9f68f533120b86fa39c1b8db46b3aa7c1bbea7fdfd4fcba
    restart: unless-stopped
    logging: *__C__-logging
    env_file:
      - ${KATAP_SECRETS}/__C__.redis.env
    # appendonly: queued jobs (verification mail, among others) survive a restart.
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - __C__-redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  edge:
    name: katap-edge
    external: true

volumes:
  __C__-db:
  __C__-redis:
