# Deploy settings for component __C__ (laravel-api). Read by bin/kit as data,
# never sourced. One key per line; values are single words or space-separated lists.
type=laravel-api
# The image repository CI publishes (no tag, no digest). A deploy is refused for any
# other repository.
image=ghcr.io/OWNER/REPO
# The GitHub repository whose publish workflow must have attested the image.
source_repo=OWNER/REPO
# attested: deploy only images attested by source_repo's publish-image.yml (the
# default, and available for public repositories on every GitHub plan). none: for a
# private repository on a plan without attestations; anyone able to push to image=
# can then deploy it.
provenance=attested
# Which environment this component belongs to. A host's CI key serves one
# environment (provision.sh --ci-env), so a staging deploy can never replace a
# production component, even with both on one server.
environment=production
domains=__DOMAINS__
port=80
# One-shots, in order, before the new release serves (DEPLOYMENT.md §14).
predeploy=__C__-migrate __C__-permissions
# Long-running services, recreated in this order (workers before the API).
rollout=__C__-worker __C__
smoke_service=__C__
smoke_path=/api/health/ready
smoke_body="status":"ready"
cron=__C__-scheduler
backup=__C__-db
