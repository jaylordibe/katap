# Deploy workflow for an application repository, at .github/workflows/deploy.yml
# next to publish-image.yml. connect.sh prints the command that writes it with the
# pin below filled in, and sets everything this header lists; to do it by hand,
# copy it and follow docs/connecting-apps.md.
#
#   Staging:    deploys automatically after each successful publish from `staging`.
#   Production: Actions → Deploy → Run workflow, then a required reviewer approves.
#
# This header is the one list of what the workflow reads. In the repository's
# settings, the environments `staging` and/or `production`, each with:
#   secrets    KATAP_HOST            the server's address
#              KATAP_SSH_KEY         the private half of the key authorised with
#                                    provision.sh --ci-key … --ci-env <environment>
#                                    --ci-project <project> --ci-component <component>
#              KATAP_KNOWN_HOSTS     the server's known_hosts line, taken on the server
#   variables  KATAP_PROJECT         the project on the server
#              KATAP_COMPONENT       the component this repository deploys
#              KATAP_IMAGE           the image repository, e.g. ghcr.io/you/shop-api
#              KATAP_MIGRATE_IMAGE   only for a nestjs-api: ghcr.io/you/shop-api-migrate
#              KATAP_URL             optional: a public URL to check afterwards
#   and the repository variable PUBLISH_ENABLED=true (publish-image.yml publishes
#   nothing without it). Always yours to set, for production: required reviewers
#   ("prevent self-review" on) and deployment branches limited to `main`.
#
# Pin the Katap action to the commit of a release, never to a tag: it receives
# the deploy key. Replace the all-zero commit below with that release's commit.

name: Deploy

on:
  workflow_run:
    # Must match the `name:` of your publish workflow exactly. jaylordibe/laravel-api
    # names it "Publish Image", nestjs-api and examples/publish-image.yml "Publish image".
    workflows: [Publish image, Publish Image]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: The image tag to deploy (main, staging, or sha-<the full 40-character commit>)
        type: string
        default: main
        required: true

# One deploy per environment at a time; another waits.
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    # A publish that failed, or that published nothing (PUBLISH_ENABLED unset), has
    # nothing to deploy.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Deploy
        uses: jaylordibe/katap@0000000000000000000000000000000000000000 # vX.Y.Z: the commit of a Katap release
        with:
          host: ${{ secrets.KATAP_HOST }}
          ssh-key: ${{ secrets.KATAP_SSH_KEY }}
          known-hosts: ${{ secrets.KATAP_KNOWN_HOSTS }}
          project: ${{ vars.KATAP_PROJECT }}
          component: ${{ vars.KATAP_COMPONENT }}
          # After a publish, the exact build it made; by hand, the tag you chose.
          image: ${{ vars.KATAP_IMAGE }}:${{ github.event_name == 'workflow_run' && format('sha-{0}', github.event.workflow_run.head_sha) || inputs.tag }}
          migrate-image: ${{ vars.KATAP_MIGRATE_IMAGE }}
          url: ${{ vars.KATAP_URL }}
