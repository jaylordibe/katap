# An application repository's workflow: build the image, push it to GitHub's
# registry, deploy it with Katap. Copy it to .github/workflows/ unchanged, then
# add the secrets and variables `katap deploy-key <project> <component>` printed
# on the server. Nothing in this file names your server or your project.
#
# The build is GitHub's standard one ("Publishing Docker images" in GitHub's
# docs): the repository's own Dockerfile, pushed to ghcr.io under the commit.
# Only the deploy jobs are Katap's. A repository that already builds its image in
# its own workflow keeps that, and adds the two deploy jobs below to it: they fit
# wherever the build job is named `publish` and outputs the pushed digest as
# `image` (laravel-api's and nestjs-api's publish-image.yml do; a nestjs-api
# uncomments the jobs' migrate-image line).
#
# A push to main deploys production once the KATAP_PROJECT variable is set; a
# push to staging deploys staging once KATAP_STAGING_PROJECT is set. Until then
# the image is built and pushed, and nothing is deployed.

name: Build and deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# One release at a time per branch, in push order: a later push never deploys
# before an earlier one has finished.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Build, scan and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
      # A nestjs-api: uncomment, with its build step below and the deploy jobs' migrate-image.
      # migrate-image: ${{ steps.name.outputs.image }}-migrate@${{ steps.migrate.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          # A frontend that bakes values in at build time takes them here, e.g.:
          # build-args: |
          #   PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}

      # A fixable HIGH or CRITICAL vulnerability stops the release here.
      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # A nestjs-api also builds its `migrate` target, under the same commit:
      # - name: Build and push the migrate image
      #   id: migrate
      #   uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      #   with:
      #     context: .
      #     target: migrate
      #     push: true
      #     tags: ${{ steps.name.outputs.image }}-migrate:sha-${{ github.sha }}

  # Each deploy job is its own job so that it holds only packages: read: the
  # server pulls with this job's token, and gets no more than it may do.
  deploy:
    name: Deploy to production
    needs: publish
    # !cancelled() and the result: a job skipped further up (a test job some
    # branches skip) must not skip the deploy of a publish that succeeded.
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main' && vars.KATAP_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
    steps:
      - name: Deploy with Katap
        # Pinned by commit: this step receives the deploy key. Dependabot's
        # github-actions updates, when the repository has them on, move it to each
        # new Katap release; any release from v2.0.3 of your server's major version
        # works (docs/updating.md).
        uses: jaylordibe/katap@fb59955eb99312e3366f78e0c5017dc797e3665e # v2.0.3
        with:
          host: ${{ secrets.KATAP_HOST }}
          known-hosts: ${{ secrets.KATAP_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.KATAP_SSH_KEY }}
          project: ${{ vars.KATAP_PROJECT }}
          component: ${{ vars.KATAP_COMPONENT }}
          image: ${{ needs.publish.outputs.image }}
          # migrate-image: ${{ needs.publish.outputs.migrate-image }}   # a nestjs-api
          url: ${{ vars.KATAP_URL }}

  deploy-staging:
    name: Deploy to staging
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/staging' && vars.KATAP_STAGING_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
    steps:
      - name: Deploy with Katap
        uses: jaylordibe/katap@fb59955eb99312e3366f78e0c5017dc797e3665e # v2.0.3
        with:
          host: ${{ secrets.KATAP_STAGING_HOST }}
          known-hosts: ${{ secrets.KATAP_STAGING_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.KATAP_STAGING_SSH_KEY }}
          project: ${{ vars.KATAP_STAGING_PROJECT }}
          component: ${{ vars.KATAP_STAGING_COMPONENT }}
          image: ${{ needs.publish.outputs.image }}
          # migrate-image: ${{ needs.publish.outputs.migrate-image }}   # a nestjs-api
          url: ${{ vars.KATAP_STAGING_URL }}
