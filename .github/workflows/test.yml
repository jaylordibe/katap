name: Test

# Katap's own checks: shellcheck, the project contract, secrets, deploy refusals,
# ssh-dispatch, provenance, the action, the smoke check and the edge configuration
# (tests/run.sh), plus actionlint on every workflow this repository ships. The end-to-end deploy
# (E2E=1 tests/run.sh) needs a laravel-api checkout and runs locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests/run.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: katap
          # Every release tag: the suite runs earlier releases' actions against
          # this server (one major version, one request form).
          fetch-depth: 0
      # Beside it, as on a developer's machine: the suite checks the templates
      # against the starters' own contracts (the settings nestjs-api requires at
      # boot), and that the starters never mention Katap.
      - name: Checkout nestjs-api
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jaylordibe/nestjs-api
          path: nestjs-api
          persist-credentials: false
      - name: Checkout laravel-api
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jaylordibe/laravel-api
          path: laravel-api
          persist-credentials: false
      - name: Run the suite
        working-directory: katap
        run: tests/run.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint every workflow, including the examples apps copy
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color .github/workflows/*.yml examples/*.yml
