name: Deploy

# The ONLY place anything is deployed from. Applications publish images; this
# workflow decides which of them run, on which host.
#
#   By hand:   Actions → Deploy → Run workflow (environment, project, component, image).
#   By an app: its publish workflow may run this workflow for STAGING, with a token
#              whose only permission on this repository is Actions: write. It can
#              start runs; it cannot change a file here.
#
# Each GitHub environment (production, staging) is one host and holds its secrets:
#   DEPLOY_HOST          host name or address
#   DEPLOY_USER          the deploy user (provision.sh: `deploy`)
#   DEPLOY_SSH_KEY       private key whose public half provision.sh --ci-key authorised
#   DEPLOY_KNOWN_HOSTS   the host's known_hosts line(s), taken once from a trusted network
#   REGISTRY_READ_TOKEN  read:packages token, when the images are private (optional)
#   ATTESTATION_READ_TOKEN  token able to read the source repositories' attestations,
#                        when those repositories are private (optional)
#
# REQUIRED repository settings (README "Securing the deploy path"), because this
# workflow's code is what holds the keys:
#   - a ruleset on main: pull request required, no bypass, force pushes blocked;
#   - each environment's deployment branches limited to main;
#   - required reviewers on production, which turns a production deploy into a
#     person approving it.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target host (GitHub environment)
        type: choice
        options: [staging, production]
        required: true
      project:
        description: Project (projects/<project>)
        type: string
        required: true
      component:
        description: Component (projects/<project>/<component>.conf)
        type: string
        required: true
      image:
        description: Image, as <repository>:<tag> or <repository>@sha256:<digest>
        type: string
        required: true
      migrate_image:
        description: Migrate image (nestjs-api), when `image` is a digest; a tag names both
        type: string
        required: false

# One deploy per host, project and component at a time; another queues. `kit
# deploy` also holds a per-project lock on the host.
concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.project }}-${{ inputs.component }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project }}/${{ inputs.component }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
      attestations: read
    # Read through env, never interpolated into a script: a value containing shell
    # syntax must stay data.
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT: ${{ inputs.project }}
      COMPONENT: ${{ inputs.component }}
      IMAGE: ${{ inputs.image }}
      MIGRATE_IMAGE: ${{ inputs.migrate_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_READ_TOKEN || github.token }}

      - name: Resolve digests and verify provenance
        id: release
        env:
          GH_TOKEN: ${{ secrets.ATTESTATION_READ_TOKEN || github.token }}
        run: .github/scripts/resolve-release.sh

      # The key exists only inside this step, and only for the `ssh` call: it is
      # removed before any other step runs.
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REQUEST: ${{ steps.release.outputs.request }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::DEPLOY_HOST and DEPLOY_SSH_KEY must be set on the '$ENVIRONMENT' environment."; exit 1; }
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # Pinned, never ssh-keyscan: trusting whatever answers on port 22 would hand
          # the deploy to whoever intercepts the first packet.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null || { echo "::error::DEPLOY_KNOWN_HOSTS is empty or malformed."; exit 1; }
          # The host's authorized_keys runs `kit ssh-dispatch <this environment>`
          # whatever is sent; the request below is what it reads as
          # SSH_ORIGINAL_COMMAND, and the key's environment, not the request,
          # decides which components it may touch. The deploy itself
          # keeps running on the host if this connection drops.
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ForwardAgent=no -o ServerAliveInterval=30 \
            "${DEPLOY_USER:-deploy}@$DEPLOY_HOST" "$REQUEST"

      - name: Public smoke check
        if: steps.release.outputs.smoke_url != ''
        env:
          SMOKE_URL: ${{ steps.release.outputs.smoke_url }}
          SMOKE_BODY: ${{ steps.release.outputs.smoke_body }}
        run: sh lib/smoke-check.sh "$SMOKE_URL" "$SMOKE_BODY"
