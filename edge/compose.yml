# The shared edge: the ONLY container on this host that publishes ports.
#
# Every project's public components join the `katap-edge` network under the alias
# `<project>-<component>`, and their site blocks (projects/*/site.caddy) are
# imported by the Caddyfile. Data services never join this network.
#
# Managed by `katap edge up` / `katap edge reload`; settings live in edge.env.
name: katap-edge

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # IPv4 only. IPv6 clients would reach Caddy through Docker's userland proxy with
    # the network gateway as their address, so every one of them would share one
    # client IP (and one rate-limit bucket). Publish no AAAA record for these sites;
    # IPv6 is a known ceiling (README).
    # EDGE_HTTP_PORT / EDGE_HTTPS_PORT exist for the test suite, which cannot
    # assume 80 and 443 are free on a developer machine. Leave them unset on a server.
    ports:
      - '0.0.0.0:${EDGE_HTTP_PORT:-80}:80'
      - '0.0.0.0:${EDGE_HTTPS_PORT:-443}:443'
      - '0.0.0.0:${EDGE_HTTPS_PORT:-443}:443/udp'
    environment:
      TLS_MODE: ${TLS_MODE:?set TLS_MODE in edge/edge.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../projects:/etc/caddy/projects:ro
      - ${KATAP_SRV:-/srv}/edge/certs:/etc/caddy/certs:ro
      # Holds issued certificates and ACME account keys. Losing it means
      # re-issuing every certificate, which runs into the CA's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_IP:?set CADDY_IP in edge/edge.env}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  edge:
    name: katap-edge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?set EDGE_SUBNET in edge/edge.env}
          ip_range: ${EDGE_IP_RANGE:?set EDGE_IP_RANGE in edge/edge.env}

volumes:
  caddy_data:
  caddy_config:
